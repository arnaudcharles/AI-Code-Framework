name: container-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-build-scan-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: local/example-app:ci
          load: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: local/example-app:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Smoke test
        run: |
          docker run --rm --name app-smoke local/example-app:ci >/tmp/app.log 2>&1 &
          sleep 3
          docker ps --filter "name=app-smoke" --filter "status=running" --format "{{.Names}}" | grep -q app-smoke
          docker rm -f app-smoke
